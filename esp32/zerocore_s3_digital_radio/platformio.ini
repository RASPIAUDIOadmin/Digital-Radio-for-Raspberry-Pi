[env:zerocore_s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
extra_scripts = pre:embed_firmware.py

; Starting point for an ESP32-S3 dev board with 8 MB flash. Change the flash
; layout and the RADIO_PIN_* flags to match the actual board and wiring.
[env:generic_s3]
extends = env:zerocore_s3
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
